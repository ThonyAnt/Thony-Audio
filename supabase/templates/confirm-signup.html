<!-- Thony Audio — "Confirm signup" email.
     Paste into Supabase → Authentication → Email Templates → Confirm signup.
     Requires Site URL set to your domain (Authentication → URL Configuration). -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#fefdfd;padding:40px 0;font-family:Georgia,'Times New Roman',serif;">
  <tr>
    <td align="center">
      <table width="460" cellpadding="0" cellspacing="0" role="presentation" style="background:#eae5db;border:1px solid #d8d4ce;">
        <tr>
          <td style="padding:34px 38px 0;">
            <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#756855;">Thony Audio</p>
            <h1 style="margin:14px 0 0;font-size:30px;font-weight:600;color:#040404;letter-spacing:-0.5px;">Confirm your email</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 38px 0;">
            <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#292826;">
              Welcome — you're almost set. Confirm this address to activate your account and reach your plugin downloads and licenses.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 38px 36px;">
            <!-- .RedirectTo = the emailRedirectTo our code passes (window.location.origin/auth/confirm),
                 so the same template serves localhost AND production; falls back to Site URL if absent -->
            <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=signup"
               style="display:inline-block;background:#b85c3a;color:#fefdfd;font-family:Helvetica,Arial,sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;padding:13px 26px;">
              Confirm email
            </a>
            <p style="margin:22px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#756855;">
              If you didn't create a Thony Audio account, you can safely ignore this email.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin:18px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#a39a87;">© Thony Audio · Hand-built audio software</p>
    </td>
  </tr>
</table>
