<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="thony audio">
  <title>thony audio</title>

  <!-- ── paper texture (subtle crumple + grain). Tune the two overlay opacities below. ── -->
  <defs>
    <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- cream field -->
  <rect width="1024" height="1024" fill="#f2ecdc"/>

  <!-- mark: red crossbar triangle + earth (tan) stem triangle -->
  <path d="M348 352 672 352 460 462 Z" fill="#b35f3e"/>   <!-- red:   top-left, top-right, apex -->
  <path d="M495 443 672 352 478 622 Z" fill="#d8c49d"/>   <!-- earth: vertex-on-red-edge, top-right, tip -->

  <!-- paper overlays (cover field + shapes, sit under the wordmark) -->
  <rect width="1024" height="1024" filter="url(#mottle)" opacity="0.09" style="mix-blend-mode:multiply"/>
  <rect width="1024" height="1024" filter="url(#grain)"  opacity="0.10" style="mix-blend-mode:multiply"/>

  <!-- wordmark -->
  <text x="512" y="744" text-anchor="middle" fill="#453624"
        font-family="'Poppins','Century Gothic','Futura',sans-serif"
        font-weight="300" font-size="42" letter-spacing="16">thony audio</text>
</svg>
